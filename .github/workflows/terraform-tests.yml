name: Terraform Integration Tests

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

jobs:
  terraform-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Integration Tests
        run: terraform test
        env:
          TF_VAR_ne_vande_db_password: ${{ secrets.NE_VANDE_DB_PASSWORD || 'CITestPassword123!' }}
          TF_VAR_vitality_db_password: ${{ secrets.VITALITY_DB_PASSWORD || 'CITestPassword123!' }}
          TF_VAR_proaging360_db_password: ${{ secrets.PROAGING360_DB_PASSWORD || 'CITestPassword123!' }}
