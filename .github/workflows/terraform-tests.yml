name: Terraform Integration Tests

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

jobs:
  terraform-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Integration Tests
        env:
          NE_VANDE_PW: ${{ secrets.NE_VANDE_DB_PASSWORD || 'CITestPassword123!' }}
          VITALITY_PW: ${{ secrets.VITALITY_DB_PASSWORD || 'CITestPassword123!' }}
          PROAGING360_PW: ${{ secrets.PROAGING360_DB_PASSWORD || 'CITestPassword123!' }}
        run: |
          export TF_VAR_db_passwords="{\"ne_vande\":\"${NE_VANDE_PW}\",\"vitality\":\"${VITALITY_PW}\",\"proaging360\":\"${PROAGING360_PW}\"}"
          terraform test
